version: "3.7"

services:
  wordle_dev:
    image: node:latest
    restart: always
    command: "sh -c 'npm clean-install && npm install typescript -g && tsc && npm run dev'"
    ports:
      - 5003:5000
    working_dir: /wordle
    profiles:
      - dev
    volumes:
      - ./:/wordle
    environment:
      - MONGO_URI=mongodb://${MONGO_HOST}/wordle_dev
    networks:
      - proxy
      - mongo
      - stats

  wordle_prod:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - 5000:5000
    profiles:
      - prod
    environment:
      - MONGO_URI=mongodb://${MONGO_HOST:-mongo_wordle}/wordle
      - MARIADB_HOST=${MARIADB_HOST:-stats_db}
      - MARIADB_USER=${STATS_DB_USER}
      - MARIADB_PASSWORD=${STATS_DB_PASSWORD}
      - MARIADB_DATABASE=${STATS_DB_NAME}
    networks:
      - proxy
      - mongo
      - stats

  wordle_standalone:
    image: node:latest
    restart: always
    command: "sh -c 'npm clean-install && npm install typescript -g && tsc && npm run dev'"
    ports:
      - ${PORT}:${PORT}
    working_dir: /wordle
    profiles:
      - standalone
    volumes:
      - ./:/wordle
    environment:
      - MONGO_URI=mongodb://${MONGO_HOST}/wordle
      - PORT=${PORT}
    networks:
      - proxy
      - mongo
      - stats
    depends_on:
      - mongo
      - mariadb

  mongo:
    image: mongo
    container_name: mongo_wordle
    restart: always
    environment:
      - MONGO_HOST=mongo_wordle
    profiles:
      - standalone
      - dev
      - prod
    volumes:
      - /var/lib/mongodb_wordle:/data/db
      - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - mongo

  mariadb:
    image: mariadb
    restart: always
    container_name: stats_db
    profiles:
      - standalone
      - dev
      - prod
    environment:
      - MARIADB_ROOT_PASSWORD=root_secret
      - MARIADB_DATABASE=${STATS_DB_NAME}
      - MARIADB_USER=${STATS_DB_USER}
      - MARIADB_PASSWORD=${STATS_DB_PASSWORD}
    volumes:
      - /var/lib/mariadb_stats:/var/lib/mysql
      - ./scripts/stats.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stats

  model:
    build:
      context: .
      dockerfile: Dockerfile.data
    scale: 0
    command: "python3 upload.py -s -d ${MONGO_DB} -c ../model/crosswrds_uniq -b ../model/new_spelling_bee -p ../model/possible_words.txt -w ../model/words.txt -dh mongo_wordle -f ../model/fallback_bee -m"
    volumes:
      - ./:/wordle
    working_dir: /wordle/scripts
    profiles:
      - model
    depends_on:
      - mongo
    networks:
      - mongo

networks:
  mongo:
  proxy:
  stats:
